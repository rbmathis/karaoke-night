services:
  karaoke-night:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karaoke-night
    user: "0:0"
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_FILE: /data/karaoke.db
    volumes:
      - ./data:/data
